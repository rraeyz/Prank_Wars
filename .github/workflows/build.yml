name: test-and-build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: 4.4.1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-v2

      - name: Install Godot + export templates
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          curl -sSL -o g.zip https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          unzip -q g.zip && rm g.zip
          curl -sSL -o t.tpz https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          unzip -q t.tpz && rm t.tpz
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mv templates/windows_release_x86_64.exe templates/linux_release.x86_64 templates/version.txt ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
          rm -rf templates

      - name: Import project
        run: timeout 300 ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --path . --import || true

      - name: Run tests
        run: GODOT=~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 tests/run.sh

      - name: Network test (host + client on localhost)
        run: GODOT=~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 timeout 150 tests/net_test.sh

      - name: Add GodotSteam (Windows only, MIT) for Steam lobbies
        run: |
          curl -sSL -o gs.zip https://codeberg.org/godotsteam/godotsteam/archive/0cea61c303130141e4df5f088a70031d6d2d4dda.zip
          unzip -q gs.zip -d gs
          mkdir -p addons/godotsteam
          cp -r gs/godotsteam/addons/godotsteam/win64 gs/godotsteam/addons/godotsteam/license.md addons/godotsteam/
          printf '%s\n' '[configuration]' 'entry_symbol = "godotsteam_init"' 'compatibility_minimum = "4.4"' '' '[libraries]' \
            'windows.debug.x86_64 = "res://addons/godotsteam/win64/libgodotsteam.windows.template_debug.x86_64.dll"' \
            'windows.release.x86_64 = "res://addons/godotsteam/win64/libgodotsteam.windows.template_release.x86_64.dll"' '' \
            '[dependencies]' 'windows.x86_64 = { "res://addons/godotsteam/win64/steam_api64.dll": "" }' > addons/godotsteam/godotsteam.gdextension
          rm -rf gs gs.zip

      - name: Export Windows
        run: |
          mkdir -p build/win
          timeout 300 ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --path . --import || true
          ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --path . --export-release "Windows Desktop" build/win/PrankWars.exe
          echo 480 > build/win/steam_appid.txt
          cp HOW_TO_PLAY.txt build/win/ || true
          ls -la build/win
          cd build/win && zip -q ../PrankWars-Windows.zip * && cd ../..
          mkdir -p build/demo
          ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --path . --export-release "Windows Demo" build/demo/PrankWarsDemo.exe
          cp build/win/*.dll build/win/steam_appid.txt build/win/HOW_TO_PLAY.txt build/demo/ 2>/dev/null || true
          cd build/demo && zip -q ../PrankWarsDemo-Windows.zip *

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PrankWars-Windows
          path: build/win/

      - name: Publish pre-release (download from the Releases page)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Prank Wars test build ${{ github.run_number }}
          prerelease: true
          target_commitish: ${{ github.sha }}
          files: |
            build/PrankWars-Windows.zip
            build/PrankWarsDemo-Windows.zip
          body: |
            Windows test build from commit ${{ github.sha }}.
            Download PrankWars-Windows.zip, extract ALL files into one folder, run PrankWars.exe.
